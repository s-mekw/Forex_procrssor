# Task 10.2 Multi-Timeframe RCI Chart Configuration
# マルチタイムフレームRCI分析チャート設定
# ========================================================================

[general]
# 一般設定
# ----------------------------------------
test_mode = "full"  # テストモード: "quick"(簡易), "full"(完全)
use_mock_data = false  # モックデータ使用フラグ
save_results = true  # テスト結果の保存フラグ
verbose = true  # 詳細ログ出力フラグ

[mt5]
# MT5接続設定
# 注意: 実際の認証情報は.envファイルに設定してください
# ----------------------------------------
login = 12345678  # プレースホルダー - 実際のログインIDは.envに設定
password = "placeholder"  # プレースホルダー - 実際のパスワードは.envに設定
server = "Demo-Server"  # プレースホルダー - 実際のサーバー名は.envに設定
timeout = 60000  # 接続タイムアウト時間（ミリ秒）
max_retries = 3  # 最大リトライ回数
retry_delay = 1.0  # リトライ間隔（秒）

[chart]
# チャート共通設定
# ----------------------------------------
symbol = "EURJPY#"  # 取引シンボル
initial_bars = 200  # 初期表示バー数（M1）
max_bars_m1 = 10000  # M1の最大保存バー数
max_bars_m5 = 2000   # M5の最大保存バー数
update_interval = 1.0  # 更新間隔（秒）
realtime_enabled = true  # リアルタイム更新の有効化
show_grid = true  # グリッド表示フラグ

[chart.m1]
# M1（1分足）タイムフレーム設定
# ----------------------------------------
timeframe = "M1"
# サブウィンドウ1: 短期RCI
rci_periods_subwindow1 = [9, 13]
# サブウィンドウ2: 中期RCI
rci_periods_subwindow2 = [24, 33, 48]
# サブウィンドウ3: 長期RCI
rci_periods_subwindow3 = [66, 108]

[chart.m5]
# M5（5分足）タイムフレーム設定
# ----------------------------------------
timeframe = "M5"
# サブウィンドウ1: 中期RCI（5分足基準）
rci_periods_subwindow1 = [24, 33, 48]
# サブウィンドウ2: 長期RCI（5分足基準）
rci_periods_subwindow2 = [66, 108]
# M5は2つのサブウィンドウのみ（Task 10.2仕様）

[rci]
# RCI（Rank Correlation Index）インジケーター設定
# ----------------------------------------
use_float32 = true  # 32ビット浮動小数点を使用（メモリ節約）
add_reliability = false  # 信頼性フラグを追加するか

[rci.levels]
# RCI基準レベル
# ----------------------------------------
overbought = 80  # 買われすぎレベル
oversold = -80  # 売られすぎレベル
zero_line = 0  # ゼロライン

[rci.colors.m1]
# M1 RCI色設定
# ----------------------------------------
9 = "blue"  # RCI 9期間
13 = "red"  # RCI 13期間
24 = "green"  # RCI 24期間
33 = "purple"  # RCI 33期間
48 = "orange"  # RCI 48期間
66 = "brown"  # RCI 66期間
108 = "pink"  # RCI 108期間

[rci.colors.m5]
# M5 RCI色設定
# ----------------------------------------
24 = "green"  # RCI 24期間
33 = "purple"  # RCI 33期間
48 = "orange"  # RCI 48期間
66 = "brown"  # RCI 66期間
108 = "pink"  # RCI 108期間

[theme]
# チャートテーマ設定
# ----------------------------------------
background = "#fffbea"  # 背景色（クリーム色）
grid = "#e0e0e0"  # グリッド線色（薄いグレー）
text = "#000000"  # テキスト色（黒）

[theme.candlestick]
# ローソク足の色設定
# ----------------------------------------
bullish = "#ffffff"  # 陽線（上昇）- 白
bearish = "#000000"  # 陰線（下降）- 黒

[theme.rci]
# RCIパネルの設定
# ----------------------------------------
background = "#1a1a1a"  # RCIパネル背景色
grid = "#2a2a2a"  # RCIグリッド線色
overbought_line = "#ff6666"  # 買われすぎライン色
oversold_line = "#66ff66"  # 売られすぎライン色
zero_line = "#666666"  # ゼロライン色

[performance]
# パフォーマンス設定
# ----------------------------------------
use_float32 = true  # 32ビット浮動小数点使用フラグ
cache_size = 10000  # キャッシュサイズ（バー数）
update_batch_size = 100  # バッチ更新サイズ

[symbols]
# テスト用シンボルリスト
# ----------------------------------------
forex = ["EURUSD", "GBPUSD", "USDJPY", "EURJPY#"]
default = "EURJPY#"  # デフォルトシンボル

[dash]
# Dashウェブサーバー設定
# ----------------------------------------
host = "0.0.0.0"  # リッスンホスト
port = 8052  # ポート番号（Task 10.2専用）
debug = false  # デバッグモード
auto_refresh_interval = 1000  # チャート自動更新間隔（ミリ秒）

[dash.ui]
# DashのUIコンポーネント設定
# ----------------------------------------
show_start_button = true  # 開始ボタン表示
show_stop_button = true  # 停止ボタン表示
show_statistics = true  # 統計情報表示
chart_height = 1200  # チャート全体の高さ（ピクセル）

# Task 10.2仕様メモ
# ========================================================================
# Task 10.2の目的:
# - マルチタイムフレーム分析機能の実装テスト
# - 1分足データから5分足データの動的リサンプリング検証
# - 短期RCI（1分足ベース）と長期RCI（5分足ベース）の同時表示
#
# RCI期間設定の根拠:
# - M1短期: [9, 13] - 短期トレンド把握
# - M1中期: [24, 33, 48] - 中期トレンド把握
# - M1長期: [66, 108] - 長期トレンド把握
# - M5中期: [24, 33, 48] - 5分足での中期トレンド（120, 165, 240期間相当）
# - M5長期: [66, 108] - 5分足での長期トレンド（330, 540期間相当）